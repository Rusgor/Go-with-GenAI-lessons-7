<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false}'>
  <title>{{.Title}} · LibraTrack</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/catalog">LibraTrack</a>
    <nav>
      {{if .LoggedIn}}
        <span class="role">Signed in as {{.Role}}</span>
        <form method="post" action="/logout" class="inline"><button type="submit" class="link">Log out</button></form>
      {{else}}
        <a href="/login">Log in</a>
      {{end}}
    </nav>
  </header>
  <main>
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
