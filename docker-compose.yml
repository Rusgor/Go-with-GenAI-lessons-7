services:
  postgres:
    image: postgres:16-alpine
    container_name: libratrack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libratrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libratrack}
      POSTGRES_DB: ${POSTGRES_DB:-libratrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - libratrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-libratrack} -d ${POSTGRES_DB:-libratrack}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  libratrack-postgres-data:
